<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium - Android app for Sonarr, Radarr, Jellyfin, Plex and more</title>
  <meta name="description" content="Free, open-source Android app to manage Sonarr, Radarr, Lidarr, Prowlarr, Jellyfin, Plex, qBittorrent, SABnzbd and 20+ more self-hosted services from one place.">
  <link rel="canonical" href="https://retransmit.github.io/Atrium/">
  <meta name="theme-color" content="#141218">
  <!-- No font CDNs. The text face is bundled via @fontsource in main.js and
       BeerCSS ships its own Material Symbols, so the page loads nothing from
       a third party. -->
  <link rel="icon" type="image/png" href="/assets/icon/atrium_icon.png">
  <link rel="apple-touch-icon" href="/assets/icon/atrium_icon.png">

  <!-- Link previews (Discord, Reddit, Mastodon, X). Absolute URLs: the
       scrapers do not resolve relative ones. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Atrium">
  <meta property="og:url" content="https://retransmit.github.io/Atrium/">
  <meta property="og:title" content="Atrium - Your self-hosted media, unified">
  <meta property="og:description" content="One open-source Android app for Sonarr, Radarr, Jellyfin, Plex, qBittorrent and 25 more self-hosted services.">
  <meta property="og:image" content="https://retransmit.github.io/Atrium/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Atrium app icon and tagline beside a phone showing the Emby home screen">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Atrium",
    "url": "https://retransmit.github.io/Atrium/",
    "description": "Free, open-source Android app to manage a self-hosted media stack: Sonarr, Radarr, Lidarr, Prowlarr, Bazarr, Seerr, Jellyfin, Emby, Plex, Tautulli, qBittorrent, SABnzbd and more.",
    "operatingSystem": "Android",
    "applicationCategory": "UtilitiesApplication",
    "image": "https://retransmit.github.io/Atrium/assets/og-image.jpg",
    "screenshot": "https://retransmit.github.io/Atrium/assets/hero_emby_1080.webp",
    "downloadUrl": "https://f-droid.org/packages/app.atrium/",
    "installUrl": "https://f-droid.org/packages/app.atrium/",
    "license": "https://www.gnu.org/licenses/gpl-3.0.html",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "sameAs": ["https://github.com/retransmit/Atrium"]
  }
  </script>
</head>

<body class="dark">
  <!-- Navbar -->
  <include src="./src/components/navbar.html" />

  <main class="responsive">
    <include src="./src/components/hero.html" />
    <include src="./src/components/marquee.html" />
    <div class="wavy-divider"></div>
    <include src="./src/components/fdroid.html" />
    <div class="wavy-divider"></div>
    <include src="./src/components/showcase.html" />
    <div class="wavy-divider"></div>
    <include src="./src/components/integrations.html" />
    <div class="wavy-divider"></div>
    <include src="./src/components/features.html" />
  </main>

  <div class="wavy-divider"></div>

  <include src="./src/components/footer.html" />

  <script type="module" src="/src/main.js"></script>
</body>

</html>
