name: service_rtorrent
description: rTorrent XML-RPC client and UI screens for Atrium.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  core_models:
  core_networking:
  core_profile:
  core_ui:
  dio: ^5.7.0
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  meta: ^1.16.0
  progress_indicator_m3e:
  # MIT, pure Dart, no network access of its own. rTorrent speaks XML-RPC, so
  # unlike every other module here a real XML parser is unavoidable.
  xml: ^6.6.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
